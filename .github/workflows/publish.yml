name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the "Environment name" in the PyPI trusted publisher
    # (pypi.org -> autolineage -> Settings -> Publishing).
    environment:
      name: pypi
      url: https://pypi.org/project/autolineage/
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          INIT=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('autolineage/__init__.py').read()).group(1))")
          echo "tag=$TAG pyproject=$PKG __init__=$INIT"
          test "$TAG" = "$PKG" && test "$PKG" = "$INIT"

      - name: Build package
        run: python -m build

      - name: Check distribution metadata
        run: twine check --strict dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
