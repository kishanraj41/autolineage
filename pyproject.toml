[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autolineage"
version = "0.5.0"
description = "Zero-code data lineage for Python ML pipelines: automatic tracking, anomaly detection, and root-cause localization across pandas, scikit-learn, and PySpark."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Kishan Raj Vandhavasi", email = "kishanraj41@gmail.com" }
]
keywords = [
    "data-lineage",
    "mlops",
    "observability",
    "data-quality",
    "ml-engineering",
    "pandas",
    "scikit-learn",
    "pyspark",
    "anomaly-detection",
    "data-provenance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.0.0"]
pyspark = ["pyspark>=3.0.0"]
jupyter = ["ipython>=7.0.0"]
all = [
    "scikit-learn>=1.0.0",
    "pyspark>=3.0.0",
    "ipython>=7.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "twine>=4.0.0",
    "build>=1.0.0",
    "scikit-learn>=1.0.0",
    "pyspark>=3.0.0",
    "ipython>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/kishanraj41/autolineage"
Repository = "https://github.com/kishanraj41/autolineage"
Issues = "https://github.com/kishanraj41/autolineage/issues"
Changelog = "https://github.com/kishanraj41/autolineage/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["autolineage*"]
exclude = ["tests*", "examples*", "paper*", "benchmarks*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]